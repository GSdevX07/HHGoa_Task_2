version: "3.8"

services:
  voice-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-rag-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - STT_PROVIDER=${STT_PROVIDER:-sarvam}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-true}
      - RETRIEVAL_CANDIDATE_POOL=${RETRIEVAL_CANDIDATE_POOL:-20}
      - RERANKER_TOP_K=${RERANKER_TOP_K:-3}
      - RETRIEVAL_THRESHOLD=${RETRIEVAL_THRESHOLD:-0.15}
    restart: unless-stopped
